<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>StoryBeat — Carnet des commandes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fuchsia:#ff3aa8; --violet:#9b4dff; --blue:#1fd6ff;
    --grad:linear-gradient(90deg,#ff3aa8,#9b4dff,#1fd6ff);
    --bg:#faf7ff; --card:#ffffff; --card2:#f3eefb; --line:#e3d9f5;
    --txt:#211a33; --muted:#6b6480;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--txt);font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;padding:22px 14px 70px}
  .wrap{max-width:920px;margin:0 auto}
  .logo{font-family:'Sora',sans-serif;font-weight:800;font-size:22px;letter-spacing:.5px}
  .logo .b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  a{color:var(--violet)}
  /* écran mot de passe */
  .gate{max-width:400px;margin:56px auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 14px 40px -26px rgba(90,50,140,.4)}
  .gate h1{font-family:'Sora';font-weight:800;font-size:20px;margin:14px 0 6px}
  .gate p{color:var(--muted);font-size:14px;margin:0 0 18px}
  input[type=password]{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--txt);font-size:15px;font-family:inherit}
  input:focus{outline:none;border-color:var(--violet)}
  .btn{border:none;cursor:pointer;font-family:'Sora',sans-serif;font-weight:700;font-size:14px;color:#fff;background:var(--grad);padding:12px 18px;border-radius:12px;box-shadow:0 10px 24px -12px rgba(155,77,255,.7)}
  .btn:disabled{opacity:.55;cursor:wait}
  .btn.ghost{background:#fff;color:#4a3f66;border:1px solid var(--line);box-shadow:none;font-family:'Manrope';font-weight:600}
  .btn.block{width:100%;margin-top:14px}
  .err{color:#d6006a;font-size:13px;margin-top:12px;min-height:18px}
  /* en-tête */
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .hactions{display:flex;gap:10px;flex-wrap:wrap}
  .sub{color:var(--muted);font-size:13px;margin:2px 0 20px}
  /* finances */
  .finances{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .tile .v{font-family:'Sora',sans-serif;font-weight:800;font-size:22px;margin-top:4px}
  .tile.net .v{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .breakdown{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .pill{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted)}
  .pill b{color:var(--txt)}
  /* filtres */
  .filters{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .frow .flab{font-size:12px;color:var(--muted);margin-right:2px}
  .chip{cursor:pointer;font-size:13px;font-weight:600;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);transition:.15s}
  .chip.on{background:var(--card2);color:var(--txt);border-color:var(--violet)}
  /* statut couleurs */
  .st-a-traiter{background:#fff5e6;color:#b26a00;border:1px solid #ffe2b3}
  .st-en-cours{background:#f0eaff;color:#6d34d6;border:1px solid #ddccff}
  .st-livree{background:#e7f8f1;color:#0f9d63;border:1px solid #b7ecd5}
  .st-remboursee{background:#ffe9f1;color:#b3245f;border:1px solid #ffc9dd}
  /* cartes */
  .list{display:flex;flex-direction:column;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 12px 30px -24px rgba(90,50,140,.35)}
  .ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .cnum{font-family:'Sora',sans-serif;font-weight:800;font-size:16px}
  .cmail{color:var(--muted);font-size:13.5px;margin-top:2px;word-break:break-all}
  .cdate{color:var(--muted);font-size:12px;margin-top:2px}
  .badge{font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;white-space:nowrap}
  .b-form{font-size:12px;font-weight:700;padding:5px 11px;border-radius:8px;background:var(--card2);color:#6d34d6;border:1px solid var(--line);display:inline-block}
  .btn-produce{display:inline-block;text-decoration:none;font-family:'Sora',sans-serif;font-weight:700;font-size:13px;color:#fff;background:var(--grad);padding:9px 14px;border-radius:10px;box-shadow:0 8px 20px -12px rgba(155,77,255,.7)}
  .lignes{margin:12px 0;font-size:13.5px}
  .ligne{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
  .ligne .bump{font-size:11px;color:var(--muted);font-weight:600;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px}
  .total{display:flex;justify-content:space-between;border-top:1px dashed var(--line);margin-top:6px;padding-top:8px;font-weight:800;font-family:'Sora',sans-serif}
  .chanson{background:#fbf8ff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
  .chanson .ch-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
  .ch-ok{color:#0f9d63;font-weight:700}
  .ch-wait{color:#b26a00;font-weight:700}
  .ch-cat{color:var(--muted)}
  .ch-note{color:var(--muted);font-size:11.5px}
  .histoire-btn{margin-left:auto;cursor:pointer;background:none;border:none;color:var(--violet);font-weight:700;font-size:12.5px;font-family:'Manrope'}
  .histoire-body{display:none;white-space:pre-wrap;font-size:12.5px;color:var(--txt);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;line-height:1.5}
  .histoire-body.show{display:block}
  .stbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .stbtn{cursor:pointer;font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--muted);font-family:'Manrope';transition:.15s}
  .stbtn.active{border-color:transparent}
  .stbtn:disabled{opacity:.5;cursor:wait}
  .empty,.spin{text-align:center;color:var(--muted);padding:50px 18px;border:1px dashed var(--line);border-radius:16px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#fff;border:1px solid var(--line);box-shadow:0 12px 30px -14px rgba(90,50,140,.5);padding:12px 18px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;max-width:90%}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .liens{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  .liens-t{font-family:'Sora',sans-serif;font-weight:700;font-size:13px;margin-bottom:8px}
  .lien{margin-bottom:8px}
  .lien-lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .lien-row{display:flex;gap:8px;align-items:center;margin-top:3px}
  .lien-row a{flex:1;min-width:0;font-size:12.5px;word-break:break-all;color:var(--violet)}
  .lien-main{background:#f0eaff;border:1px solid #ddccff;border-radius:10px;padding:8px 10px}
  .lien-main .lien-row a{font-weight:700}
  .copybtn{border:1px solid var(--line);background:var(--card2);color:#4a3f66;font-weight:700;font-size:11.5px;padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .prodid{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  .prodid label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .prodid .row2{display:flex;gap:8px}
  .prodinput{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:var(--txt)}
  .prodinput:focus{outline:none;border-color:var(--violet)}
  .prodsave{border:1px solid var(--line);background:var(--card2);color:#4a3f66;font-weight:700;font-size:12.5px;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .prodsave:disabled{opacity:.5;cursor:wait}
  /* blocs par chanson (commandes à 2 chansons) */
  .songblock{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fbf8ff}
  .songblock-t{font-family:'Sora',sans-serif;font-weight:800;font-size:14px;margin-bottom:2px}
  .songblock .liens{margin-top:10px}
  .songblock .prodid{margin-top:10px}
  /* Niveau 1 : recherche + tableau des commandes */
  .search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--txt);font-size:14px;font-family:inherit}
  .search:focus{outline:none;border-color:var(--violet)}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 12px 30px -24px rgba(90,50,140,.35)}
  .otable{width:100%;border-collapse:collapse;font-size:13.5px}
  .otable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  .otable td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  .otable tbody tr{cursor:pointer;transition:background .12s}
  .otable tbody tr:hover{background:var(--card2)}
  .otable tbody tr:last-child td{border-bottom:none}
  .c-email b{font-size:14px}
  .c-sub{color:var(--muted);font-size:11.5px;margin-top:2px;word-break:break-all}
  .c-nb{text-align:center;font-weight:700}
  .c-montant{font-weight:700;white-space:nowrap}
  .q-ok{color:#0f9d63;font-weight:700;white-space:nowrap}
  .q-wait{color:#b26a00;font-weight:700;white-space:nowrap}
  .dl{font-weight:700;white-space:nowrap}
  .dl-green{color:#0f9d63}
  .dl-orange{color:#b26a00}
  .dl-red{color:#d6006a}
  .dl-none{color:var(--muted)}
  .dl-budget{display:block;font-size:10.5px;color:var(--muted);font-weight:600;margin-top:1px}
  .back-btn{margin-bottom:14px}
  /* Fichiers cliente (Premium) */
  .clifiles{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  .clifiles-t{font-family:'Sora',sans-serif;font-weight:700;font-size:13px;margin-bottom:8px}
  .clifiles-sub{font-family:'Sora',sans-serif;font-weight:700;font-size:12px;color:var(--muted);margin:10px 0 6px}
  .clifiles-empty{color:var(--muted);font-size:12.5px}
  .clifiles-list{display:flex;flex-direction:column;gap:6px}
  .clifile{display:flex;align-items:center;gap:10px;background:#fbf8ff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .clifile-name{flex:1;min-width:0;font-size:12.5px;word-break:break-all}
  .clifile-size{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .clifile-dl{text-decoration:none;background:var(--card2);border:1px solid var(--line);color:#4a3f66;font-weight:700;font-size:11.5px;padding:6px 10px;border-radius:8px;white-space:nowrap}
  @media(max-width:560px){ .finances{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">

  <!-- ÉCRAN MOT DE PASSE -->
  <div id="gate" class="gate">
    <div class="logo">STORY<span class="b">BEAT</span></div>
    <h1>Carnet des commandes</h1>
    <p>Espace privé. Entre ton mot de passe pour accéder à tes commandes.</p>
    <input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <button class="btn block" id="go">Ouvrir le carnet</button>
    <div class="err" id="gateErr"></div>
  </div>

  <!-- APP -->
  <div id="app" style="display:none">
    <header>
      <div class="logo">STORY<span class="b">BEAT</span> · Carnet</div>
      <div class="hactions">
        <button class="btn" id="refresh">🔄 Mettre à jour</button>
        <button class="btn ghost" id="logout">Se déconnecter</button>
      </div>
    </header>
    <div class="sub" id="sub">Tableau de bord des commandes</div>

    <div class="finances" id="finances"></div>
    <div class="breakdown" id="breakdown"></div>

    <div class="filters" id="filters">
      <div class="frow"><input id="search" class="search" type="text" placeholder="🔍 Rechercher une commande (email ou n°)" autocomplete="off"></div>
      <div class="frow" id="fStatut"><span class="flab">Statut :</span></div>
      <div class="frow" id="fQuest"><span class="flab">Questionnaire :</span></div>
    </div>

    <div class="list" id="list"><div class="spin">Chargement…</div></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
  var API_LIST   = '/api/carnet-list';
  var API_BUILD  = '/api/build-commandes';
  var API_SET    = '/api/set-statut';
  var API_CLIENT = '/api/client';
  var STATUTS = ['à traiter','en cours','livrée','remboursée'];

  var PW = '';
  var STATE = { all: [], fStatut: 'tous', fQuest: 'tous', q: '', selected: null };
  var $ = function(s){ return document.querySelector(s); };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function eur(n){ return (Number(n)||0).toFixed(2).replace('.',',')+' €'; }
  function isPremium(c){ return String((c&&c.formule)||'').toLowerCase().indexOf('premium') > -1; }
  function humanSize(b){ b=Number(b)||0; if(b>=1048576) return (b/1048576).toFixed(1)+' Mo'; if(b>=1024) return Math.max(1,Math.round(b/1024))+' Ko'; return b+' o'; }
  function statutClass(s){ return 'st-' + String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]+/gi,'-').toLowerCase(); }
  function dateFr(iso){ if(!iso) return '—'; try{ return new Date(iso).toLocaleString('fr-FR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; } }
  function formuleClass(f){ return 'b-form'; }
  function questComplet(f){ return Array.isArray(f.chansons) && f.chansons.length>0 && f.chansons.every(function(c){ return c.questionnaire==='présent'; }); }
  function toast(m){ var t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._x); t._x=setTimeout(function(){ t.classList.remove('show'); }, 2600); }

  // ---------- délai restant (SLA) ----------
  // Essentielle → 24h après l'heure de commande ; Populaire / Premium (et autres) → 12h.
  function delaiHeures(c){
    var f = String(c.formule||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
    return f.indexOf('essentiel') > -1 ? 24 : 12;
  }
  // Rendu coloré : vert > 3h, orange ≤ 3h, rouge si dépassé, — pour livrée/remboursée ou date absente.
  function delaiHTML(c){
    if(c.statut==='livrée' || c.statut==='remboursée') return '<span class="dl-none">—</span>';
    if(!c.date) return '<span class="dl-none">—</span>';
    var h = delaiHeures(c);
    var ech = new Date(c.date).getTime() + h*3600*1000;
    if(isNaN(ech)) return '<span class="dl-none">—</span>';
    var diffH = (ech - Date.now())/3600000;
    var budget = '<span class="dl-budget">sur '+h+'h</span>';
    if(diffH < 0) return '<span class="dl dl-red">🔴 dépassé</span>'+budget;
    var restH = Math.ceil(diffH);
    var cls = diffH > 3 ? 'dl-green' : 'dl-orange';
    var ico = diffH > 3 ? '⏱️' : '⚠️';
    return '<span class="dl '+cls+'">'+ico+' '+restH+'h restantes</span>'+budget;
  }

  // ---------- ligne compacte (Niveau 1) ----------
  function rowHTML(c){
    var quest = questComplet(c) ? '<span class="q-ok">✅ complet</span>' : '<span class="q-wait">⏳ attente</span>';
    return '<tr class="orow" data-order="'+esc(c.order_id)+'">'+
      '<td class="c-email"><b>'+esc(c.email||'—')+'</b><div class="c-sub">#'+esc(c.order_id)+' · '+esc(dateFr(c.date))+'</div></td>'+
      '<td class="c-delai">'+delaiHTML(c)+'</td>'+
      '<td><span class="b-form">'+esc(c.formule||'—')+'</span></td>'+
      '<td class="c-nb">'+esc(c.nb_chansons||1)+'</td>'+
      '<td>'+quest+'</td>'+
      '<td class="c-montant">'+eur(c.montant_total_eur)+'</td>'+
      '<td><span class="badge '+statutClass(c.statut)+'">'+esc(c.statut||'—')+'</span></td>'+
    '</tr>';
  }

  // Affiche/masque les blocs d'accueil (finances, filtres) selon le niveau (liste vs détail).
  function setControlsVisible(v){
    var f=$('#finances'), b=$('#breakdown'), fl=$('#filters');
    if(f) f.style.display = v ? '' : 'none';
    if(b) b.style.display = v ? '' : 'none';
    if(fl) fl.style.display = v ? '' : 'none';
  }

  // ---------- chargement ----------
  function load(){
    $('#list').innerHTML = '<div class="spin">Chargement…</div>';
    fetch(API_LIST, { headers: { 'x-tool-password': PW } })
      .then(function(r){ if(r.status===401){ logout('Mot de passe incorrect.'); throw new Error('401'); } return r.json(); })
      .then(function(d){
        if(!d.ok){ $('#list').innerHTML = '<div class="empty">Erreur : '+esc(d.error||'inconnue')+'</div>'; return; }
        // on ne garde que les vraies fiches commandes (celles qui ont un order_id)
        STATE.all = (d.commandes||[]).filter(function(c){ return c.order_id!=null; });
        renderFinances(); renderFilters(); renderList();
      })
      .catch(function(e){ if(e.message!=='401') $('#list').innerHTML = '<div class="empty">Impossible de contacter le carnet. Réessaie.</div>'; });
  }

  // ---------- finances ----------
  function renderFinances(){
    var all = STATE.all;
    var net = 0, rembourse = 0;
    var parStatut = { 'à traiter':0, 'en cours':0, 'livrée':0, 'remboursée':0 };
    all.forEach(function(c){
      var m = Number(c.montant_total_eur)||0;
      if(c.statut==='remboursée') rembourse += m; else net += m;
      if(parStatut[c.statut]!==undefined) parStatut[c.statut]++;
    });
    $('#finances').innerHTML =
      '<div class="tile net"><div class="k">💶 Encaissé net</div><div class="v">'+eur(net)+'</div></div>'+
      '<div class="tile"><div class="k">🧾 Commandes</div><div class="v">'+all.length+'</div></div>'+
      '<div class="tile"><div class="k">↩️ Total remboursé</div><div class="v">'+eur(rembourse)+'</div></div>';
    $('#breakdown').innerHTML = STATUTS.map(function(s){
      return '<span class="pill">'+esc(s)+' : <b>'+(parStatut[s]||0)+'</b></span>';
    }).join('');
  }

  // ---------- filtres ----------
  function renderFilters(){
    var st = ['tous'].concat(STATUTS);
    $('#fStatut').innerHTML = '<span class="flab">Statut :</span>' + st.map(function(s){
      return '<span class="chip'+(STATE.fStatut===s?' on':'')+'" data-f="statut" data-v="'+esc(s)+'">'+esc(s==='tous'?'Tous':s)+'</span>';
    }).join('');
    var q = [['tous','Tous'],['complet','Complet'],['attente','En attente ⏳']];
    $('#fQuest').innerHTML = '<span class="flab">Questionnaire :</span>' + q.map(function(p){
      return '<span class="chip'+(STATE.fQuest===p[0]?' on':'')+'" data-f="quest" data-v="'+p[0]+'">'+esc(p[1])+'</span>';
    }).join('');
  }

  function filtered(){
    var q = String(STATE.q||'').trim().toLowerCase();
    return STATE.all.filter(function(c){
      if(STATE.fStatut!=='tous' && c.statut!==STATE.fStatut) return false;
      if(STATE.fQuest==='complet' && !questComplet(c)) return false;
      if(STATE.fQuest==='attente' && questComplet(c)) return false;
      if(q){ var hay = (String(c.email||'')+' '+String(c.order_id||'')).toLowerCase(); if(hay.indexOf(q)===-1) return false; }
      return true;
    }).sort(function(a,b){
      var da=(a.date||a._maj_le||''), db=(b.date||b._maj_le||'');
      return da<db?1:(da>db?-1:0); // récent → ancien
    });
  }

  // ---------- bloc "Chanson N" (identifiant + liens) — utilisé quand nb_chansons === 2 ----------
  // Chanson 1 lit/écrit prod_id ; chanson 2 lit/écrit prod_id_2. Liens construits depuis l'identifiant du bloc.
  function songSection(order, numero, prodId, field){
    var produce = '<div style="margin-top:10px"><a class="btn-produce" href="/?commande='+encodeURIComponent(order)+'&chanson='+numero+'" target="_blank" rel="noopener">🎛️ Produire la Chanson '+numero+'</a></div>';
    var liens = '';
    if (prodId) {
      var B = 'https://ecoute.storybeat.fr';
      var vLien = B + '/valider/?id=' + prodId + '-choix';
      var eA = B + '/?id=' + prodId + '-a';
      var eB = B + '/?id=' + prodId + '-b';
      var row = function(lab, url, main){
        return '<div class="lien'+(main?' lien-main':'')+'"><span class="lien-lab">'+lab+'</span>'+
          '<div class="lien-row"><a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(url)+'</a>'+
          '<button type="button" class="copybtn" data-copy="'+esc(url)+'">Copier</button></div></div>';
      };
      liens = '<div class="liens"><div class="liens-t">🔗 Liens à envoyer</div>'+
        row('Validation — à envoyer à la cliente', vLien, true)+
        row('Écoute A', eA, false)+
        row('Écoute B', eB, false)+
        '</div>';
    }
    var prod = '<div class="prodid"><label>🎬 Identifiant de production <span style="font-weight:400">(celui du Moteur, ex. clara-k7x — sans -a ni -choix)</span></label>'+
      '<div class="row2"><input type="text" class="prodinput" data-field="'+field+'" placeholder="ex : clara-k7x" value="'+esc(prodId||'')+'"><button type="button" class="prodsave" data-field="'+field+'">Enregistrer</button></div></div>';
    return '<div class="songblock"><div class="songblock-t">🎵 Chanson '+numero+'</div>'+produce+liens+prod+'</div>';
  }

  // ---------- rendu du détail COMPLET d'une commande (Niveau 2) — inchangé ----------
  function detailHTML(c){
    var lignes = (c.lignes||[]).map(function(l){
      return '<div class="ligne"><span>'+esc(l.nom)+(l.bump?'<span class="bump">bump</span>':'')+'</span><span>'+eur(l.montant_eur)+'</span></div>';
    }).join('');
    var chansons = (c.chansons||[]).map(function(ch){
      var present = ch.questionnaire==='présent';
      var head = '<div class="ch-top"><b>Chanson '+ch.numero+'</b>'+
        (present ? '<span class="ch-ok">✅ questionnaire présent</span>' : '<span class="ch-wait">⏳ en attente</span>')+
        (present && ch.categorie ? '<span class="ch-cat">· '+esc(ch.categorie)+'</span>' : '')+
        (present && ch.chanson_precisee===false ? '<span class="ch-note">(n° non précisé)</span>' : '')+
        (present && ch.histoire ? '<button class="histoire-btn" data-hist>Voir l\'histoire ▾</button>' : '')+
        '</div>';
      var body = (present && ch.histoire) ? '<div class="histoire-body">'+esc(ch.histoire)+'</div>' : '';
      return '<div class="chanson">'+head+body+'</div>';
    }).join('');
    var stbtns = STATUTS.map(function(s){
      var active = (c.statut===s);
      return '<button class="stbtn'+(active?' active '+statutClass(s):'')+'" data-st="'+esc(s)+'"'+(active?' disabled':'')+'>'+esc(s)+'</button>';
    }).join('');
    var liens = '';
    if (c.prod_id) {
      var B = 'https://ecoute.storybeat.fr';
      var vLien = B + '/valider/?id=' + c.prod_id + '-choix';
      var eA = B + '/?id=' + c.prod_id + '-a';
      var eB = B + '/?id=' + c.prod_id + '-b';
      var row = function(lab, url, main){
        return '<div class="lien'+(main?' lien-main':'')+'"><span class="lien-lab">'+lab+'</span>'+
          '<div class="lien-row"><a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(url)+'</a>'+
          '<button type="button" class="copybtn" data-copy="'+esc(url)+'">Copier</button></div></div>';
      };
      liens = '<div class="liens"><div class="liens-t">🔗 Liens à envoyer</div>'+
        row('Validation — à envoyer à la cliente', vLien, true)+
        row('Écoute A', eA, false)+
        (c.nb_chansons===2 ? row('Écoute B', eB, false) : '')+
        '</div>';
    }
    // Bloc identifiants + liens :
    //  · nb_chansons === 2 → deux blocs séparés (Chanson 1 → prod_id, Chanson 2 → prod_id_2)
    //  · sinon (1 chanson ou absent) → EXACTEMENT comme avant : un seul champ prod_id + son bloc de liens
    // Bouton "Produire" : commande à 1 chanson → un seul bouton en tête (comme avant) ;
    // commande à 2 chansons → un bouton par bloc chanson (rendu dans songSection), pas de bouton en tête.
    var produceHeader = (c.nb_chansons === 2) ? '' :
      '<div style="margin-top:10px"><a class="btn-produce" href="/?commande='+encodeURIComponent(c.order_id)+'" target="_blank" rel="noopener">🎛️ Produire cette commande</a></div>';
    var prodSection;
    if (c.nb_chansons === 2) {
      prodSection = songSection(c.order_id, 1, c.prod_id, 'prod_id') + songSection(c.order_id, 2, c.prod_id_2, 'prod_id_2');
    } else {
      prodSection = liens +
        '<div class="prodid"><label>🎬 Identifiant de production <span style="font-weight:400">(celui du Moteur, ex. clara-k7x — sans -a ni -choix)</span></label>'+
        '<div class="row2"><input type="text" class="prodinput" placeholder="ex : clara-k7x" value="'+esc(c.prod_id||'')+'"><button type="button" class="prodsave">Enregistrer</button></div></div>';
    }
    // Bloc "Fichiers de la cliente" : seulement pour les commandes Premium ayant un prod_id.
    // Rendu vide au départ (placeholder) ; rempli en asynchrone par hydrateFiles/loadClientFiles.
    var filesBlock = '';
    if (isPremium(c) && c.prod_id) {
      filesBlock = '<div class="clifiles" data-prodid="'+esc(c.prod_id)+'"'+
        (c.prod_id_2 ? (' data-prodid2="'+esc(c.prod_id_2)+'"') : '')+
        ' data-two="'+(c.nb_chansons===2?'1':'0')+'">'+
        '<div class="clifiles-t">📎 Fichiers de la cliente</div>'+
        '<div class="clifiles-body">Chargement des fichiers…</div>'+
      '</div>';
    }
    return ''+
      '<div class="ctop">'+
        '<div><div class="cnum">Commande #'+esc(c.order_id)+'</div>'+
          '<div class="cmail">'+esc(c.email||'—')+'</div>'+
          '<div class="cdate">'+esc(dateFr(c.date))+'</div></div>'+
        '<span class="badge '+statutClass(c.statut)+'">'+esc(c.statut||'—')+'</span>'+
      '</div>'+
      '<div style="margin-top:10px"><span class="b-form">'+esc(c.formule||'—')+'</span></div>'+
      produceHeader+
      '<div class="lignes">'+lignes+'<div class="total"><span>Total</span><span>'+eur(c.montant_total_eur)+'</span></div></div>'+
      chansons+
      '<div class="stbtns">'+stbtns+'</div>'+
      prodSection+
      filesBlock;
  }

  // ---------- fichiers cliente (Premium) : liste via client.js?action=list + mot de passe ----------
  function fetchClientFiles(prodId){
    return fetch(API_CLIENT+'?action=list&c='+encodeURIComponent(prodId), { headers:{ 'x-tool-password':PW } })
      .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
      .then(function(d){ if(!d.ok) throw new Error(d.error||'err'); return d.files||[]; });
  }
  function filesGroupHTML(label, files, error){
    var head = label ? '<div class="clifiles-sub">'+label+'</div>' : '';
    if(error)        return head+'<div class="clifiles-empty">Fichiers indisponibles pour le moment.</div>';
    if(!files.length) return head+'<div class="clifiles-empty">Aucun fichier uploadé.</div>';
    var rows = files.map(function(f){
      return '<div class="clifile"><span class="clifile-name">'+esc(f.name)+'</span>'+
        '<span class="clifile-size">'+humanSize(f.size)+'</span>'+
        '<a class="clifile-dl" href="'+esc(f.url)+'" target="_blank" rel="noopener" download>Télécharger</a></div>';
    }).join('');
    return head+'<div class="clifiles-list">'+rows+'</div>';
  }
  function loadClientFiles(box){
    if(!box || box._loading) return; box._loading = true;
    var body = box.querySelector('.clifiles-body');
    var two  = box.getAttribute('data-two')==='1';
    var jobs = [{ pid: box.getAttribute('data-prodid'), label: two?'🎵 Chanson 1':null }];
    var pid2 = box.getAttribute('data-prodid2'); if(pid2) jobs.push({ pid:pid2, label:'🎵 Chanson 2' });
    Promise.all(jobs.map(function(j){
      return fetchClientFiles(j.pid).then(function(files){ return filesGroupHTML(j.label, files, false); })
        .catch(function(){ return filesGroupHTML(j.label, [], true); });
    })).then(function(parts){ if(body) body.innerHTML = parts.join(''); })
       .catch(function(){ if(body) body.innerHTML = '<div class="clifiles-empty">Fichiers indisponibles pour le moment.</div>'; });
  }
  // Charge les fichiers du bloc .clifiles présent dans un conteneur détail (non-bloquant).
  function hydrateFiles(scope){ var box = scope && scope.querySelector ? scope.querySelector('.clifiles') : null; if(box) loadClientFiles(box); }

  function renderList(){
    var el = $('#list');
    // ----- Niveau 2 : détail complet d'une commande -----
    if(STATE.selected != null){
      setControlsVisible(false);
      var c = STATE.all.filter(function(x){ return String(x.order_id)===String(STATE.selected); })[0];
      var back = '<button type="button" class="btn ghost back-btn" data-back>← Retour à la liste</button>';
      if(!c){ el.innerHTML = back + '<div class="empty">Commande introuvable.</div>'; return; }
      el.innerHTML = back + '<div class="card" data-order="'+esc(c.order_id)+'">'+detailHTML(c)+'</div>';
      hydrateFiles(el);
      return;
    }
    // ----- Niveau 1 : liste compacte (tableau) -----
    setControlsVisible(true);
    var list = filtered();
    if(!list.length){ el.innerHTML = '<div class="empty">Aucune commande pour ce filtre.</div>'; return; }
    el.innerHTML = '<div class="tablewrap"><table class="otable">'+
      '<thead><tr>'+
        '<th>Cliente</th><th>Délai restant</th><th>Formule</th><th>Chansons</th><th>Questionnaire</th><th>Montant</th><th>Statut</th>'+
      '</tr></thead><tbody>'+
      list.map(rowHTML).join('')+
      '</tbody></table></div>';
  }

  function findCardEl(order){ return document.querySelector('.card[data-order="'+String(order).replace(/"/g,'')+'"]'); }

  // ---------- changement de statut (carte seule) ----------
  function setStatut(order, statut, cardEl){
    var btns = cardEl.querySelectorAll('.stbtn');
    btns.forEach(function(b){ b.disabled=true; });
    fetch(API_SET, {
      method:'POST',
      headers:{ 'x-tool-password':PW, 'Content-Type':'application/json' },
      body: JSON.stringify({ order_id: order, statut: statut })
    }).then(function(r){ if(r.status===401){ logout('Mot de passe incorrect.'); throw new Error('401'); } return r.json(); })
      .then(function(d){
        if(!d.ok){ toast('❌ '+(d.error||'Échec')); btns.forEach(function(b){ b.disabled=false; }); return; }
        // maj du modèle en mémoire
        var c = STATE.all.filter(function(x){ return String(x.order_id)===String(order); })[0];
        if(c) c.statut = statut;
        toast('✅ Commande #'+order+' → '+statut);
        // on est en vue détail (Niveau 2) : rafraîchir le détail affiché
        if(c && cardEl){ cardEl.innerHTML = detailHTML(c); hydrateFiles(cardEl); }
        renderFinances(); renderFilters();
      })
      .catch(function(e){ if(e.message!=='401'){ toast('❌ Problème réseau'); btns.forEach(function(b){ b.disabled=false; }); } });
  }

  // ---------- enregistrer l'identifiant de production (le « pont » vers les liens) ----------
  function setProdId(order, prodId, cardEl, field){
    field = field || 'prod_id'; // 'prod_id' (chanson 1) ou 'prod_id_2' (chanson 2)
    var btn = cardEl.querySelector('.prodsave[data-field="'+field+'"]') || cardEl.querySelector('.prodsave');
    var old=btn.textContent; btn.disabled=true; btn.textContent='…';
    var payload = { order_id: order }; payload[field] = prodId;
    fetch(API_SET, { method:'POST', headers:{ 'x-tool-password':PW, 'Content-Type':'application/json' }, body: JSON.stringify(payload) })
      .then(function(r){ if(r.status===401){ logout('Mot de passe incorrect.'); throw new Error('401'); } return r.json(); })
      .then(function(d){
        if(!d.ok){ toast('❌ '+(d.error||'Échec')); btn.disabled=false; btn.textContent=old; return; }
        var c = STATE.all.filter(function(x){ return String(x.order_id)===String(order); })[0];
        if(c){ if('prod_id' in d) c.prod_id = d.prod_id; if('prod_id_2' in d) c.prod_id_2 = d.prod_id_2; }
        var saved = d[field];
        toast(saved ? ('✅ Identifiant enregistré : '+saved) : '✅ Enregistré');
        if(c && cardEl){ cardEl.innerHTML = detailHTML(c); hydrateFiles(cardEl); }
      })
      .catch(function(e){ if(e.message!=='401'){ toast('❌ Problème réseau'); btn.disabled=false; btn.textContent=old; } });
  }

  // ---------- délégation d'événements sur la liste ----------
  $('#list').addEventListener('click', function(e){
    // Niveau 2 → Niveau 1 : retour à la liste
    var back = e.target.closest ? e.target.closest('[data-back]') : null;
    if(back){ STATE.selected = null; renderList(); window.scrollTo(0,0); return; }
    // Niveau 1 → Niveau 2 : ouvrir le détail d'une commande (clic sur la ligne)
    var row = e.target.closest ? e.target.closest('.orow') : null;
    if(row){ STATE.selected = row.getAttribute('data-order'); renderList(); window.scrollTo(0,0); return; }
    var histBtn = e.target.closest ? e.target.closest('.histoire-btn') : null;
    if(histBtn){ var body = histBtn.closest('.chanson').querySelector('.histoire-body'); if(body){ body.classList.toggle('show'); histBtn.textContent = body.classList.contains('show') ? 'Masquer l\'histoire ▴' : 'Voir l\'histoire ▾'; } return; }
    var st = e.target.closest ? e.target.closest('.stbtn') : null;
    if(st && !st.disabled){ var card = st.closest('.card'); setStatut(card.getAttribute('data-order'), st.getAttribute('data-st'), card); return; }
    var save = e.target.closest ? e.target.closest('.prodsave') : null;
    if(save && !save.disabled){ var card2 = save.closest('.card'); var field = save.getAttribute('data-field') || 'prod_id'; var scope = save.closest('.songblock') || card2; var inp = scope.querySelector('.prodinput'); setProdId(card2.getAttribute('data-order'), (inp.value||'').trim(), card2, field); return; }
    var cp = e.target.closest ? e.target.closest('.copybtn') : null;
    if(cp){ var txt=cp.getAttribute('data-copy'); if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(function(){ toast('✅ Lien copié'); }).catch(function(){ toast('Copie impossible — sélectionne le lien à la main'); }); } else { toast('Copie non supportée ici'); } }
  });

  // ---------- filtres (délégation) ----------
  document.getElementById('fStatut').addEventListener('click', onFilter);
  document.getElementById('fQuest').addEventListener('click', onFilter);
  function onFilter(e){
    var chip = e.target.closest ? e.target.closest('.chip') : null;
    if(!chip) return;
    if(chip.getAttribute('data-f')==='statut') STATE.fStatut = chip.getAttribute('data-v');
    else STATE.fQuest = chip.getAttribute('data-v');
    renderFilters(); renderList();
  }

  // ---------- recherche (email ou n°) ----------
  document.getElementById('search').addEventListener('input', function(e){
    STATE.q = e.target.value || '';
    if(STATE.selected == null) renderList(); // ne s'applique qu'à la vue liste
  });

  // ---------- bouton "Mettre à jour" (parser) ----------
  $('#refresh').addEventListener('click', function(){
    var b = $('#refresh'); var old = b.textContent; b.disabled=true; b.textContent='⏳ Mise à jour…';
    fetch(API_BUILD, { method:'POST', headers:{ 'x-tool-password':PW } })
      .then(function(r){ if(r.status===401){ logout('Mot de passe incorrect.'); throw new Error('401'); } return r.json(); })
      .then(function(d){
        if(!d.ok){ toast('❌ '+(d.error||'Échec')); return; }
        var s = d.resume||{};
        toast('✅ '+(s.creees||0)+' créée(s), '+(s.mises_a_jour||0)+' MAJ, '+(s.inchangees||0)+' inchangée(s)');
        load();
      })
      .catch(function(e){ if(e.message!=='401') toast('❌ Problème réseau'); })
      .finally(function(){ b.disabled=false; b.textContent=old; });
  });

  // ---------- session ----------
  function enter(pw){ PW = pw; try{ localStorage.setItem('sb_carnet_pw', pw); }catch(e){} $('#gate').style.display='none'; $('#app').style.display='block'; load(); }
  function logout(msg){ PW=''; try{ localStorage.removeItem('sb_carnet_pw'); }catch(e){} $('#app').style.display='none'; $('#gate').style.display='block'; $('#pw').value=''; $('#gateErr').textContent = msg||''; }
  $('#go').addEventListener('click', function(){ var pw=$('#pw').value.trim(); if(!pw){ $('#gateErr').textContent='Entre ton mot de passe.'; return; } $('#gateErr').textContent=''; enter(pw); });
  $('#pw').addEventListener('keydown', function(e){ if(e.key==='Enter') $('#go').click(); });
  $('#logout').addEventListener('click', function(){ logout(); });
  (function(){ var saved=''; try{ saved=localStorage.getItem('sb_carnet_pw')||''; }catch(e){} if(saved) enter(saved); })();
</script>
</body>
</html>
